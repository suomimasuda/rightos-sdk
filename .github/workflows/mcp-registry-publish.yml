# Publish @i-s3/rightos-mcp to npm (OIDC) and the official MCP Registry.
# Do NOT create npm granular access tokens for CI — they expire ≤90 days.
# Setup: npm Packages → @i-s3/rightos-mcp → Settings → Trusted publishing
#   owner=suomimasuda repo=rightos-sdk workflow=mcp-registry-publish.yml
name: mcp-registry-publish

on:
  workflow_dispatch:
  push:
    tags:
      - "mcp-v*"

permissions:
  id-token: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Validate tag matches package and server.json versions
        if: startsWith(github.ref, 'refs/tags/mcp-v')
        run: |
          set -eu
          TAG="${GITHUB_REF#refs/tags/}"
          EXPECTED="${TAG#mcp-v}"
          PKG_VER=$(node -p "require('./package.json').version")
          SERVER_VER=$(node -p "require('./server.json').version")
          echo "tag=$TAG expected=$EXPECTED pkg=$PKG_VER server=$SERVER_VER"
          test "$EXPECTED" = "$PKG_VER" || { echo "package.json version mismatch"; exit 1; }
          test "$EXPECTED" = "$SERVER_VER" || { echo "server.json version mismatch"; exit 1; }

      - name: Build MCP server
        run: |
          npm ci
          npm run build

      - name: OIDC dry-run (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: bash ../scripts/oidc-npm-publish.sh dry-run

      - name: Publish to npm (tag)
        if: startsWith(github.ref, 'refs/tags/mcp-v')
        run: bash ../scripts/oidc-npm-publish.sh publish

      - name: Install MCP Publisher CLI
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Login to MCP Registry (GitHub OIDC)
        run: mcp-publisher login github-oidc

      # The registry refuses a version it cannot fetch from npm, and a fresh
      # publish takes up to a couple of minutes to be served.
      - name: Wait for npm to serve the new version
        if: startsWith(github.ref, 'refs/tags/mcp-v')
        run: |
          set -eu
          PKG_VER=$(node -p "require('./package.json').version")
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://registry.npmjs.org/@i-s3%2Frightos-mcp/$PKG_VER")
            if [ "$code" = "200" ]; then
              echo "npm is serving $PKG_VER after $((i * 10))s"
              exit 0
            fi
            echo "npm returned $code for $PKG_VER — retrying ($i/60)"
            sleep 10
          done
          echo "::error::npm did not serve $PKG_VER within 10 minutes"
          exit 1

      - name: Publish to MCP Registry
        if: startsWith(github.ref, 'refs/tags/mcp-v')
        run: mcp-publisher publish

      - name: Verify registry listing
        env:
          # workflow_dispatch only runs the OIDC dry-run, so package.json's version
          # is not in the registry yet — check the listing is reachable instead.
          REQUIRE_VERSION: ${{ startsWith(github.ref, 'refs/tags/mcp-v') && '1' || '0' }}
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          export PKG_VER
          curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.suomimasuda/rightos-mcp" \
            | python3 -c "
          import json, sys, os
          expected = os.environ['PKG_VER']
          d = json.load(sys.stdin)
          servers = d.get('servers', [])
          assert servers, 'registry returned no listing for io.github.suomimasuda/rightos-mcp'
          versions = [s['server']['version'] for s in servers]
          print('registry listing:', servers[0]['server']['name'], 'versions', versions)
          if os.environ['REQUIRE_VERSION'] == '1':
              assert expected in versions, f'expected {expected} in registry, got {versions}'
              print('registry OK:', expected)
          else:
              print('dry-run: not requiring', expected)
          "
